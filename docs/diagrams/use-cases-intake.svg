<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1225px;height:646px;background:#FFFFFF;" width="1225px" height="646px" viewBox="0 0 1225 646" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="9"><text x="309.952" y="22.995" fill="#000" font-size="14" textLength="598.575" font-weight="700">DocuSense use cases: incoming-document screening (station and operator)</text></g><!--cluster DocuSense--><g class="cluster" data-qualified-name="DocuSense" id="ent0003" data-source-line="29"><rect x="418.67" y="77.747" width="792.81" height="538" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><text x="771.636" y="92.742" fill="#000" font-size="14" textLength="86.878" font-weight="700">DocuSense</text></g><!--cluster Incoming-document screening--><g class="cluster" data-qualified-name="DocuSense.Incoming-document screening" id="ent0004" data-source-line="30"><rect x="442.67" y="120.747" width="744.81" height="471" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><text x="695.535" y="135.742" fill="#000" font-size="14" textLength="239.08" font-weight="700">Incoming-document screening</text></g><!--entity I_BATCH--><g class="entity" data-qualified-name="DocuSense.Incoming-document screening.I_BATCH" id="ent0005" data-source-line="31"><ellipse cx="607.257" cy="287.745" rx="76.487" ry="24.888" fill="#F4F8FC" style="stroke:#2F5D8A;stroke-width:0.5;"/><text x="565.359" y="282.56" fill="#000" font-size="14" textLength="83.795">Start or end</text><text x="552.542" y="298.857" fill="#000" font-size="14" textLength="109.43">an intake batch</text></g><!--entity I_SUBMIT--><g class="entity" data-qualified-name="DocuSense.Incoming-document screening.I_SUBMIT" id="ent0006" data-source-line="33"><ellipse cx="607.259" cy="374.751" rx="123.169" ry="27.034" fill="#F4F8FC" style="stroke:#2F5D8A;stroke-width:0.5;"/><text x="514.396" y="372.294" fill="#000" font-size="14" textLength="185.726">Submit page for screening</text><text x="524.049" y="388.59" fill="#000" font-size="14" textLength="166.421">(type, indicators, fields)</text></g><!--entity I_CAPTURE--><g class="entity" data-qualified-name="DocuSense.Incoming-document screening.I_CAPTURE" id="ent0007" data-source-line="35"><ellipse cx="1028.172" cy="509.75" rx="120.502" ry="35.524" fill="#F4F8FC" style="stroke:#2F5D8A;stroke-width:0.5;"/><text x="965.084" y="495.109" fill="#000" font-size="14" textLength="126.178">Capture page and</text><text x="957.479" y="511.406" fill="#000" font-size="14" textLength="141.388">check image quality</text><text x="939.856" y="527.703" fill="#000" font-size="14" textLength="176.634">(recapture up to 3 times)</text></g><!--entity I_DECIDE--><g class="entity" data-qualified-name="DocuSense.Incoming-document screening.I_DECIDE" id="ent0008" data-source-line="36"><ellipse cx="1028.172" cy="374.747" rx="143.312" ry="34.12" fill="#F4F8FC" style="stroke:#2F5D8A;stroke-width:0.5;"/><text x="985.293" y="357.912" fill="#000" font-size="14" textLength="85.757">Decide tray:</text><text x="931.816" y="374.209" fill="#000" font-size="14" textLength="192.712">passed screening -> Tray 1</text><text x="917.956" y="390.506" fill="#000" font-size="14" textLength="220.432">needs manual review -> Tray 2</text></g><!--entity I_ROUTE--><g class="entity" data-qualified-name="DocuSense.Incoming-document screening.I_ROUTE" id="ent0009" data-source-line="37"><ellipse cx="607.263" cy="468.746" rx="148.593" ry="32.119" fill="#F4F8FC" style="stroke:#2F5D8A;stroke-width:0.5;"/><text x="497.776" y="462.349" fill="#000" font-size="14" textLength="218.976">Route page and report the tray</text><text x="478.003" y="478.646" fill="#000" font-size="14" textLength="258.521">(mismatch or jam -> manual review)</text></g><!--entity I_STATUS--><g class="entity" data-qualified-name="DocuSense.Incoming-document screening.I_STATUS" id="ent0010" data-source-line="39"><ellipse cx="607.257" cy="555.746" rx="87.097" ry="19.819" fill="#F4F8FC" style="stroke:#2F5D8A;stroke-width:0.5;"/><text x="533.688" y="560.395" fill="#000" font-size="14" textLength="147.137">Report station status</text></g><!--entity I_CONSOLE--><g class="entity" data-qualified-name="DocuSense.Incoming-document screening.I_CONSOLE" id="ent0011" data-source-line="41"><ellipse cx="607.263" cy="191.743" rx="142.453" ry="36.136" fill="#F4F8FC" style="stroke:#2F5D8A;stroke-width:0.5;"/><text x="510.005" y="180.793" fill="#000" font-size="14" textLength="194.517">Watch the operator console</text><text x="504.386" y="197.09" fill="#000" font-size="14" textLength="205.755">(status, batch, tray per page;</text><text x="516.431" y="213.386" fill="#000" font-size="14" textLength="181.665">no field values or images)</text></g><!--entity I_END--><g class="entity" data-qualified-name="DocuSense.Incoming-document screening.I_END" id="ent0012" data-source-line="43"><ellipse cx="1028.173" cy="191.749" rx="91.213" ry="20.643" fill="#F4F8FC" style="stroke:#2F5D8A;stroke-width:0.5;"/><text x="949.932" y="196.398" fill="#000" font-size="14" textLength="156.481">End the running batch</text></g><!--entity Operator--><g class="entity" data-qualified-name="Operator" id="ent0001" data-source-line="26"><ellipse cx="188.829" cy="145.797" rx="8" ry="8" fill="#F1F1F1" style="stroke:#2F5D8A;stroke-width:0.5;"/><path d="M188.829,153.797 L188.829,180.797 M175.829,161.797 L201.829,161.797 M188.829,180.797 L175.829,195.797 M188.829,180.797 L201.829,195.797" style="stroke:#2F5D8A;stroke-width:0.5;" fill="none"/><text x="111.06" y="210.292" fill="#000" font-size="14" textLength="134.88">Validation operator</text><text x="111.06" y="226.589" fill="#000" font-size="14" textLength="99.634">(registrar with</text><text x="111.06" y="242.886" fill="#000" font-size="14" textLength="155.538">validation permission)</text></g><!--entity IntakeStation--><g class="entity" data-qualified-name="IntakeStation" id="ent0002" data-source-line="27"><ellipse cx="188.833" cy="430.954" rx="8" ry="8" fill="#F1F1F1" style="stroke:#2F5D8A;stroke-width:0.5;"/><path d="M188.833,438.954 L188.833,465.954 M175.833,446.954 L201.833,446.954 M188.833,465.954 L175.833,480.954 M188.833,465.954 L201.833,480.954" style="stroke:#2F5D8A;stroke-width:0.5;" fill="none"/><text x="126.65" y="495.449" fill="#000" font-size="14" textLength="96.421">Intake station</text><text x="126.65" y="511.746" fill="#000" font-size="14" textLength="124.366">(camera + feeder</text><text x="126.65" y="528.043" fill="#000" font-size="14" textLength="87.001">+ two trays)</text><text x="154.961" y="419.152" fill="#000" font-size="14" textLength="67.744" font-style="italic">«system»</text></g><g class="entity" data-qualified-name="N1" id="ent0022" data-source-line="60"><path d="M6,43.297 L6,102.188 L371.668,102.188 L371.668,53.297 L361.668,43.297 L6,43.297" style="stroke:#B8A200;stroke-width:0.5;" fill="#FFFDE7"/><path d="M361.668,43.297 L361.668,53.297 L371.668,53.297 L361.668,43.297" style="stroke:#B8A200;stroke-width:1;" fill="#FFFDE7"/><text x="12" y="61.292" fill="#000" font-size="14" textLength="325.049">The station only measures; the backend alone</text><text x="12" y="77.589" fill="#000" font-size="14" textLength="344.668">decides passed screening / needs manual review</text><text x="12" y="93.886" fill="#000" font-size="14" textLength="288.128">and the tray. Thresholds: Administration.</text></g><!--link Operator to I_CONSOLE--><g class="link" data-entity-1="ent0001" data-entity-2="ent0011" id="lnk13" data-source-line="48" data-link-type="association"><path d="M266.7,191.747 C322.04,191.747 398.31,191.747 464.55,191.747" style="stroke:#181818;stroke-width:1;" fill="none" id="Operator-I_CONSOLE"/></g><!--link IntakeStation to I_BATCH--><g class="link" data-entity-1="ent0002" data-entity-2="ent00