<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1118px;height:473px;background:#FFFFFF;" width="1118px" height="473px" viewBox="0 0 1118 473" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="9"><text x="290.904" y="22.995" fill="#000" font-size="14" textLength="529.423" font-weight="700">DocuSense use cases: incoming-document screening (staff review)</text></g><!--cluster DocuSense--><g class="cluster" data-qualified-name="DocuSense" id="ent0003" data-source-line="29"><rect x="417.26" y="107.037" width="686.97" height="352" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><text x="717.306" y="122.032" fill="#000" font-size="14" textLength="86.878" font-weight="700">DocuSense</text></g><!--cluster Incoming-document screening--><g class="cluster" data-qualified-name="DocuSense.Incoming-document screening" id="ent0004" data-source-line="30"><rect x="441.26" y="150.037" width="638.97" height="285" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><text x="641.205" y="165.032" fill="#000" font-size="14" textLength="239.08" font-weight="700">Incoming-document screening</text></g><!--entity I_QUEUE--><g class="entity" data-qualified-name="DocuSense.Incoming-document screening.I_QUEUE" id="ent0005" data-source-line="31"><ellipse cx="574.622" cy="211.039" rx="117.362" ry="25.872" fill="#F4F8FC" style="stroke:#2F5D8A;stroke-width:0.5;"/><text x="493.089" y="207.797" fill="#000" font-size="14" textLength="163.064">Work the review queue</text><text x="495.711" y="224.094" fill="#000" font-size="14" textLength="157.821">(page image, reasons)</text></g><!--entity I_REVIEW--><g class="entity" data-qualified-name="DocuSense.Incoming-document screening.I_REVIEW" id="ent0006" data-source-line="33"><ellipse cx="94