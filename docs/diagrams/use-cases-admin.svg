<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:802px;height:667px;background:#FFFFFF;" width="802px" height="667px" viewBox="0 0 802 667" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="7"><text x="210.027" y="22.995" fill="#000" font-size="14" textLength="374.985" font-weight="700">DocuSense use cases: administration and audit</text></g><!--cluster DocuSense--><g class="cluster" data-qualified-name="DocuSense" id="ent0003" data-source-line="27"><rect x="445.96" y="44.297" width="342.08" height="609" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><text x="573.561" y="59.292" fill="#000" font-size="14" textLength="86.878" font-weight="700">DocuSense</text></g><!--cluster Administration & audit--><g class="cluster" data-qualified-name="DocuSense.Administration . audit" id="ent0004" data-source-line="28"><rect x="469.96" y="87.297" width="294.08" height="542" fill="none" style="stroke:#181818;stroke-width:1;" rx="2.5" ry="2.5"/><text x="526.827" y="102.292" fill="#000" font-size="14" textLength="180.346" font-weight="700">Administration &amp; audit</text></g><!--entity D_STAFF--><g class="entity" data-qualified-name="DocuSense.Administration . audit.D_STAFF" id="ent0005" data-source-line="29"><ellipse cx="617.005" cy="499.296" rx="115.535" ry="34.659" fill="#F4F8FC" style="stroke:#2F5D8A;stroke-width:0.5;"/><text x="552.832" y="486.086" fill="#000" font-size="14" textLength="128.345">Create staff logins</text><text x="530.113" y="502.383" fill="#000" font-size="14" textLength="173.783">(registrar, administrator;</text><text x="539.236" y="518.68" fill="#000" font-size="14" textLength="155.538">validation permission)</text></g><!--entity D_TEMPLATES--><g class="entity" data-qualified-name="DocuSense.Administration . audit.D_TEMPLATES" id="ent0006" data-source-line="31"><ellipse cx="617.003" cy="151.295" rx="131.043" ry="28.609" fill="#F4F8FC" style="stroke:#2F5D8A;stroke-width:0.5;"/><text x="514.183" y="148.83" fill="#000" font-size="14" textLength="205.639">Manage document templates</text><text x="522.742" y="165.127" fill="#000" font-size="14" textLength="188.521">(upload, preview, activate)</text></g><!--entity D_STATIONS--><g class="entity" data-qualified-name="DocuSense.Administration . audit.D_STATIONS" id="ent0007" data-source-line="33"><ellipse cx="617.002" cy="402.301" rx="123.822" ry="27.164" fill="#F4F8FC" style="stroke:#2F5D8A;stroke-width:0.5;"/><text x="539.195" y="396.611" fill="#000" font-size="14" textLength="155.613">Register or deactivate</text><text x="518.906" y="412.908" fill="#000" font-size="14" textLength="196.191">stations (issues station key)</text></g><!--entity D_THRESHOLDS--><g class="entity" data-qualified-name="DocuSense.Administration . audit.D_THRESHOLDS" id="ent0008" data-source-line="35"><ellipse cx="617.001" cy="591.293" rx="99.031" ry="22.206" fill="#F4F8FC" style="stroke:#2F5D8A;stroke-width:0.5;"/><text x="530.041" y="595.942" fill="#000" font-size="14" textLength="173.92">Set screening thresholds</text></g><!--entity D_AUDIT--><g class="entity" data-qualified-name="DocuSense.Administration . audit.D_AUDIT" id="ent0009" data-source-line="37"><ellipse cx="616.998" cy="235.296" rx="87.498" ry="19.9" fill="#F4F8FC" style="stroke:#2F5D8A;stroke-width:0.5;"/><text x="542.971" y="239.945" fill="#000" font-size="14" textLength="148.053">Search the audit trail</text></g><!--entity D_DASHBOARD--><g class="entity" data-qualified-name="DocuSense.Administration . audit.D_DASHBOARD" id="ent0010" data-source-line="39"><ellipse cx="617.001" cy="315.301" rx="112.921" ry="24.984" fill="#F4F8FC" style="stroke:#2F5D8A;stroke-width:0.5;"/><text x="514.909" y="319.949" fill="#000" font-size="14" textLength="204.183">View the registrar dashboard</text></g><!--entity Registrar--><g class="entity" data-qualified-name="Registrar" id="ent0001" data-source-line="24"><ellipse cx="215.976" cy="205.647" rx="8" ry="8" fill="#F1F1F1" style="stroke:#2F5D8A;stroke-width:0.5;"/><path d="M215.976,213.647 L215.976,240.647 M202.976,221.647 L228.976,221.647 M215.976,240.647 L202.976,255.647 M215.976,240.647 L228.976,255.647" style="stroke:#2F5D8A;stroke-width:0.5;" fill="none"/><text x="183.98" y="270.142" fill="#000" font-size="14" textLength="63.991">Registrar</text></g><!--entity Admin--><g class="entity" data-qualified-name="Admin" id="ent0002" data-source-line="25"><ellipse cx="215.981" cy="372.647" rx="8" ry="8" fill="#F1F1F1" style="stroke:#2F5D8A;stroke-width:0.5;"/><path d="M215.981,380.647 L215.981,407.647 M202.981,388.647 L228.981,388.647 M215.981,407.647 L202.981,422.647 M215.981,407.647 L228.981,422.647" style="stroke:#2F5D8A;stroke-width:0.5;" fill="none"/><text x="168.14" y="437.142" fill="#000" font-size="14" textLength="95.683">Administrator</text></g><g class="entity" data-qualified-name="N1" id="ent0019" data-source-line="53"><path d="M6,70.557 L6,162.041 L425.959,162.041 L425.959,80.557 L415.959,70.557 L6,70.557" style="stroke:#B8A200;stroke-width:0.5;" fill="#FFFDE7"/><path d="M415.959,70.557 L415.959,80.557 L425.959,80.557 L415.959,70.557" style="stroke:#B8A200;stroke-width:1;" fill="#FFFDE7"/><text x="12" y="88.552" fill="#000" font-size="14" textLength="398.959">Templates belong to the registrar, not the administrator.</text><text x="12" y="104.849" fill="#000" font-size="14" textLength="377.426">Every action that changes or checks an official record</text><text x="12" y="121.146" fill="#000" font-size="14" textLength="242.32">writes an append-only audit entry.</text><text x="12" y="137.443" fill="#000" font-size="14" textLength="394.393">A daily job (scheduler secret, no user) expires download</text><text x="12" y="153.739" fill="#000" font-size="14" textLength="241.705">windows and purges idle sessions.</text></g><!--link Registrar to D_TEMPLATES--><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk11" data-source-line="44" data-link-type="association"><path d="M248.29,228.707 C306.44,216.467 433.21,189.777 521.54,171.187" style="stroke:#181818;stroke-width:1;" fill="none" id="Registrar-D_TEMPLATES"/></g><!--link Registrar to D_AUDIT--><g class="link" data-entity-1="ent0001" data-entity-2="ent0009" id="lnk12" data-source-line="45" data-link-type="association"><path d="M248.29,235.297 C308.18,235.297 440.88,235.297 529.39,235.297" style="stroke:#181818;stroke-width:1;" fill="none" id="Registrar-D_AUDIT"/></g><!--link Registrar to D_DASHBOARD--><g class="link" data-entity-1="ent0001" data-entity-2="ent0010" id="lnk13" data-source-line="46" data-link-type="association"><path d="M248.29,241.577 C308.83,253.707 443.74,280.757 532.22,298.497" style="stroke:#181818;stroke-width:1;" fill="none" id="Registrar-D_DASHBOARD"/></g><!--link Admin to D_STAFF--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" id="lnk14" data-source-line="47" data-link-type="association"><path d="M264.32,413.807 C328.73,429.467 445.23,457.787 526.42,477.517" style="stroke:#181818;stroke-width:1;" fill="none" id="Admin-D_STAFF"/></g><!--link Admin to D_STATIONS--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" id="lnk15" data-source-line="48" data-link-type="association"><path d="M264.32,402.297 C320.26,402.297 415.51,402.297 492.78,402.297" style="stroke:#181818;stroke-width:1;" fill="none" id="Admin-D_STATIONS"/></g><!--link Admin to D_THRESHOLDS--><g class="link" data-entity-1="ent0002" data-entity-2="ent0008" id="lnk16" data-source-line="49" data-link-type="association"><path d="M262.69,440.647 C305.42,474.577 372.31,522.987 437.96,551.297 C467.78,564.157 502.26,573.127 532.89,579.267" style="stroke:#181818;stroke-width:1;" fill="none" id="Admin-D_THRESHOLDS"/></g><!--link Admin to D_AUDIT--><g class="link" data-entity-1="ent0002" data-entity-2="ent0