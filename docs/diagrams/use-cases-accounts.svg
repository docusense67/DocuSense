"N1" id="ent0027" data-source-line="57"><path d="M6,233.057 L6,340.838 L378.969,340.838 L378.969,243.057 L368.969,233.057 L6,233.057" style="stroke:#B8A200;stroke-width:0.5;" fill="#FFFDE7"/><path d="M368.969,233.057 L368.969,243.057 L378.969,243.057 L368.969,233.057" style="stroke:#B8A200;stroke-width:1;" fill="#FFFDE7"/><text x="12" y="251.052" fill="#000" font-size="14" textLength="351.969">Registrars manage student and teacher accounts;</text><text x="12" y="267.349" fill="#000" font-size="14" textLength="272.275">administrators manage every account.</text><text x="12" y="283.646" fill="#000" font-size="14" textLength="307.665">Teacher logins are created with the teacher</text><text x="12" y="299.943" fill="#000" font-size="14" textLength="267.941">(Academic records), staff logins under</text><text x="12" y="316.239" fill="#000" font-size="14" textLength="270.348">Administration. A temporary password</text><text x="12" y="332.536" fill="#000" font-size="14" textLength="215.435">must be changed at first login.</text></g><!--reverse link AnyUser to Student--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-source-line="30" data-link-type="extension"><path d="M261.129,409.945 C302.919,405.505 343.46,394.507 378.97,357.947 C450.18,284.627 391.35,226.377 438.97,135.947 C444.23,125.957 451.58,116.197 458.9,107.737" style="stroke:#181818;stroke-width:1;" fill="none" id="AnyUser-backto-Student"/><polygon points="243.23,411.847,261.763,415.912,260.495,403.979,243.23,411.847" fill="none" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--reverse link AnyUser to Teacher--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk9" data-source-line="31" data-link-type="extension"><path d="M261.056,406.743 C301.476,400.763 340.13,389.627 378.97,357.947 C422.43,322.497 407.28,293.217 438.97,246.947 C444.71,238.567 451.51,229.977 458.12,222.167" style="stroke:#181818;stroke-width:1;" fill="none