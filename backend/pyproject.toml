[project]
name = "adgvs-backend"
version = "0.1.0"
description = "Academic Document Generation & Validation System - backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
    "email-validator>=2.2",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "qrcode>=8.0",
    "weasyprint>=70",
    "httpx>=0.27",  # Supabase Storage REST API (ADGVS_STORAGE_BACKEND=supabase)
    "pillow>=10",  # scan page compression; also a WeasyPrint dependency
    "pypdfium2>=4.30",  # applicant intake: split uploaded PDFs into page images
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]  # pytest fixtures imported from another test module

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.documents.defaults" = ["*.html"]
